<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krypto-Steuer-Forensik</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f9}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="forensikApp" src="../krypto-steuer-akademie/krypto-steuer-assistent-bisheriger-stand.html" title="Krypto-Steuer-Forensik"></iframe>
<script>
(() => {
  const frame=document.getElementById('forensikApp');
  const replacements=[
    ['Krypto-Steuer-Akademie','Krypto-Steuer-Forensik'],
    ['Die Akademie führt Sie','Das Forensik-Tool führt Sie'],
    ['Die Akademie zeigt Ihnen','Das Forensik-Tool zeigt Ihnen'],
    ['Die Akademie erkennt','Das Forensik-Tool erkennt'],
    ['Die Akademie speichert','Das Forensik-Tool speichert'],
    ['Die Akademie verbindet','Das Forensik-Tool verbindet'],
    ['Die Akademie prüft','Das Forensik-Tool prüft'],
    ['Die Akademie ordnet','Das Forensik-Tool ordnet'],
    ['Vorbereitung und Dokumentation','Recherche, Beweisführung und Dokumentation']
  ];
  function rebrand(){
    try{
      const d=frame.contentDocument;if(!d)return;
      d.title='Krypto-Steuer-Forensik';
      const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
      let n;while((n=walker.nextNode())){
        let value=n.nodeValue;
        replacements.forEach(([a,b])=>{value=value.split(a).join(b)});
        if(value!==n.nodeValue)n.nodeValue=value;
      }
    }catch(e){}
  }
  frame.addEventListener('load',()=>{rebrand();setTimeout(rebrand,300);setTimeout(rebrand,1200)});
})();
</script>
</body>
</html>
