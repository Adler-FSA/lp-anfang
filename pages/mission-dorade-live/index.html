<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Dorade – Geführte Präsentation</title>
</head>
<body>
<script>
(async()=>{
  const embedded=window.self!==window.top;
  const source='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/4e5c550406f98a179f91d0cab4b3a4dffe5c4eaf/pages/mission-dorade-live/index.html';
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Präsentation konnte nicht geladen werden');
      return r.text();
    });

    if(embedded){
      html=html.replace('<html lang="de">','<html lang="de" class="embedded">');
      const css=`<style id="iframe-compat">
html.embedded,html.embedded body{width:100%!important;height:100%!important;min-height:0!important;overflow:hidden!important}
html.embedded .app{width:100%!important;height:100%!important;max-height:100%!important;min-height:0!important;overflow:hidden!important}
html.embedded .stage,html.embedded .scene,html.embedded .normal-view,html.embedded .visual,html.embedded .copy,html.embedded .focus-view,html.embedded .start-screen,html.embedded .start-cover,html.embedded .cinema,html.embedded .credits-stage,html.embedded .dorade-finale{min-width:0!important;min-height:0!important;max-height:100%!important}
html.embedded .controls{min-width:0!important;flex-shrink:0!important}
html.embedded .visual img,html.embedded .focus-view>img,html.embedded .start-cover img{max-width:100%!important;max-height:100%!important;object-fit:contain!important}
html.embedded body.present .app{height:100%!important;max-height:100%!important}
</style>`;
      html=html.replace('</head>',css+'</head>');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<p style="font-family:Arial;padding:24px">Die Mission-Dorade-Präsentation konnte nicht geladen werden. Bitte aktualisiere die Seite.</p>';
  }
})();
</script>
</body>
</html>
