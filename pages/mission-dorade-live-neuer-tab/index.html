<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Dorade – Geführte Präsentation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2c;font-family:Arial,Helvetica,sans-serif}.page{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{display:flex;align-items:center;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));background:#071b2c;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:2}.bar button{border:1px solid rgba(255,255,255,.25);border-radius:11px;padding:9px 13px;background:rgba(255,255,255,.1);color:#fff;font:800 15px Arial;cursor:pointer}.bar strong{margin-right:auto;font-size:15px}.frame{width:100%;height:100%;min-height:0;border:0;background:#fff;display:block}@media(max-width:620px){.bar strong{display:none}.bar button{padding:9px 11px}}
</style>
</head>
<body>
<div class="page">
  <nav class="bar" aria-label="Präsentationsnavigation">
    <button id="cockpit" type="button">Cockpit</button>
    <strong>Mission Dorade – Geführte Präsentation</strong>
    <button id="reload" type="button">Neu laden</button>
    <button id="fullscreen" type="button">Vollbild</button>
  </nav>
  <iframe class="frame" id="presentation" src="../mission-dorade-live/index.html" title="Mission Dorade – Geführte Präsentation" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
</div>
<script>
const cockpitUrl='https://adler-fsa.github.io/lp-anfang/pages/mission-dorade-cockpit/index.html';
document.getElementById('cockpit').addEventListener('click',()=>{location.href=cockpitUrl+'?nocache='+Date.now()});
document.getElementById('reload').addEventListener('click',()=>{const f=document.getElementById('presentation');f.src='../mission-dorade-live/index.html?nocache='+Date.now()});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){}});
</script>
</body>
</html>
