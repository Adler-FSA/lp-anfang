<style>
  :root{
    --bg:#f4f7fb;
    --bg-soft:#eef4f8;

    --ink:#243447;

    --radius-lg:18px;
    --radius-md:14px;

  *{box-sizing:border-box;}

  html,body{

    cursor:pointer;

  .lang-btn:hover{

<script>
(function () {
  const KEY = 'fsa_lang';
  const DE  = '/lp-anfang/pages/krypto/krypto-setup-modul7.html';
  const EN  = '/lp-anfang/pages/krypto/krypto-setup-modul7-en.html';

  function setPressed(lang){
    document.querySelectorAll('[data-set-lang]').forEach(btn=>{
      btn.setAttribute('aria-pressed', btn.getAttribute('data-set-lang') === lang ? 'true' : 'false');
    });
  }

  function go(lang){
    const target = (lang === 'de') ? DE : EN;
    try{ localStorage.setItem(KEY, lang); }catch(e){}
    location.assign(target + '?nocache=' + Date.now());
  }

  setPressed('de');

  document.querySelectorAll('[data-set-lang]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const lang = btn.getAttribute('data-set-lang') === 'en' ? 'en' : 'de';
      if (lang === 'de'){
        try{ localStorage.setItem(KEY, 'de'); }catch(e){}
        setPressed('de');
        return;
      }
      go(lang);
    });
  });

  window.addEventListener('storage', function(ev){
    if (ev.key === KEY){
      const v = (ev.newValue || 'de').toLowerCase() === 'en' ? 'en' : 'de';
      setPressed(v);
    }
  });
})();
</script>
<script>
(function(){
  const prefix = document.body.getAttribute('data-storage-prefix') || 'fsa-krypto-setup-m7:';

  function saveField(el){
    const key = el.getAttribute('data-storage-key');
    if (!key) return;
    let val = '';
    if (el.type === 'checkbox'){
      val = el.checked ? '1' : '0';
    } else {
      val = el.value;
    }
    try{
      localStorage.setItem(prefix + key, val);
    }catch(e){}
  }

  function loadField(el){
    const key = el.getAttribute('data-storage-key');
    if (!key) return;
    try{
      const stored = localStorage.getItem(prefix + key);
      if (stored === null) return;
      if (el.type === 'checkbox'){
        el.checked = stored === '1';
      } else {
        el.value = stored;
      }
    }catch(e){}
  }

  document.addEventListener('DOMContentLoaded', function(){
    const fields = document.querySelectorAll('[data-storage-key]');
    fields.forEach(el => {
      loadField(el);
      const evt = (el.type === 'checkbox') ? 'change' : 'input';
      el.addEventListener(evt, () => saveField(el));
    });

    const clearBtn = document.getElementById('clear-module-data');
    if (clearBtn){
      clearBtn.addEventListener('click', function(){
        if (!confirm('Möchtest du wirklich alle Eintragungen in diesem Modul löschen?')) return;
        try{
          const keys = Object.keys(localStorage);
          keys.forEach(k => {
            if (k.startsWith(prefix)) localStorage.removeItem(k);
          });
        }catch(e){}
        fields.forEach(el => {
          if (el.type === 'checkbox') el.checked = false;
          else el.value = '';
        });
      });
    }

    const printBtn = document.getElementById('print-module');
    if (printBtn){
      printBtn.addEventListener('click', function(){
        window.print();
      });
    }
  });
})();
</script>

<script>
(function(){
 const moduleNo=Number(document.body.dataset.module||0);
 const total=7;
 function completion(){
   const fields=[...document.querySelectorAll('[data-storage-key]')];
   if(!fields.length) return 0;
   let done=0;
   fields.forEach(el=>{ if(el.type==='checkbox'?el.checked:String(el.value||'').trim()) done++; });
   return Math.round(done/fields.length*100);
 }
 function refresh(){
   const p=completion();
   const f=document.querySelector('.course-progress-fill');
   const l=document.querySelector('.course-progress-value');
   if(f) f.style.width=p+'%'; if(l) l.textContent=p+'% ausgefüllt';
   localStorage.setItem('krypto-modern-progress-'+moduleNo,p);
 }
 document.addEventListener('input',()=>setTimeout(refresh,20));
 document.addEventListener('change',()=>setTimeout(refresh,20));
 window.addEventListener('load',()=>setTimeout(refresh,80));
})();
</script>
