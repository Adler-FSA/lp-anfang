<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusikBox</title>
<meta name="description" content="MusikBox – alle Songs an einem Ort hören, frei auswählen und zufällig abspielen.">
<style>
:root{--navy:#071521;--navy2:#10283a;--mint:#00d7c3;--magenta:#ef168c;--white:#fff;--muted:#b9c8d4;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(0,215,195,.18),transparent 30%),radial-gradient(circle at 90% 10%,rgba(239,22,140,.18),transparent 32%),linear-gradient(160deg,#06121d,#0b1d2b 55%,#160d20);color:#fff;font:16px/1.45 Arial,Helvetica,sans-serif;min-height:100vh}
button,input,select{font:inherit}.app{width:min(1280px,calc(100% - 24px));margin:auto;padding:22px 0 140px}
.hero{padding:22px 24px;border:1px solid var(--line);border-radius:26px;background:rgba(8,24,36,.75);backdrop-filter:blur(15px);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.hero h1{font-size:clamp(34px,7vw,72px);margin:0;background:linear-gradient(90deg,var(--mint),#fff,var(--magenta));-webkit-background-clip:text;color:transparent}.hero p{margin:8px 0 0;color:var(--muted);font-size:clamp(16px,2vw,21px)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;margin:18px 0}.search{width:100%;min-height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;padding:0 16px;outline:none}.search::placeholder{color:#a9bbc8}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip,.action{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:11px 15px;cursor:pointer;font-weight:700}.chip.active,.action.active{background:linear-gradient(90deg,var(--mint),#4ad9ff);color:#04131b;border-color:transparent}.action.magenta{background:linear-gradient(90deg,var(--magenta),#ff6db5);border:0}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.7fr);gap:18px}.panel{border:1px solid var(--line);background:rgba(7,21,33,.78);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.now{display:grid;grid-template-columns:260px 1fr;gap:22px;padding:22px}.cover{aspect-ratio:1;border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--mint),#163d59 48%,var(--magenta));box-shadow:0 20px 50px rgba(0,0,0,.35)}.cover:before{content:"♫";font-size:110px;font-weight:900;opacity:.78}.cover:after{content:"";position:absolute;width:65%;height:65%;border:2px solid rgba(255,255,255,.35);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 44px rgba(255,255,255,.04)}
.meta{min-width:0;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--mint);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.meta h2{font-size:clamp(27px,4vw,48px);line-height:1.06;margin:8px 0}.category{color:var(--muted)}
.controls{display:flex;align-items:center;gap:10px;margin:20px 0 12px;flex-wrap:wrap}.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.09);color:#fff;cursor:pointer;font-size:20px}.round.main{width:62px;height:62px;background:linear-gradient(135deg,var(--mint),#72f2e7);color:#042129;border:0;font-size:26px}.round.active{box-shadow:0 0 0 3px rgba(239,22,140,.28);background:var(--magenta)}
.timeline{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;color:var(--muted);font-size:13px}.timeline input,.volume input{width:100%;accent-color:var(--mint)}.volume{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:12px}
.lyrics-btn{margin-top:16px;border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(90deg,var(--magenta),#ff62b1);color:#fff;font-weight:900;cursor:pointer}.lyrics-btn[disabled]{opacity:.45;cursor:not-allowed}
.playlist-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.playlist-head h3{margin:0}.count{color:var(--muted);font-size:14px}.list{max-height:610px;overflow:auto}.track{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.track:hover{background:rgba(255,255,255,.07)}.track.current{background:linear-gradient(90deg,rgba(0,215,195,.18),rgba(239,22,140,.13));border-left:4px solid var(--mint)}.num{color:#8fa6b6;text-align:center}.track-title{font-weight:800}.track-cat{color:var(--muted);font-size:12px}.lyric-mark{font-size:13px;color:var(--magenta)}
.library{margin-top:18px}.library h3{margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px}.card{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:18px;padding:15px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.1)}.mini-cover{height:120px;border-radius:14px;background:linear-gradient(135deg,rgba(0,215,195,.82),rgba(20,48,69,.9),rgba(239,22,140,.78));display:grid;place-items:center;font-size:50px;margin-bottom:12px}.card h4{margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:13px}.card-actions{display:flex;gap:7px;margin-top:12px}.small-btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}
.sticky{position:fixed;z-index:10;left:0;right:0;bottom:0;background:rgba(4,14,23,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:max(10px,env(safe-area-inset-bottom)) 16px}.sticky-inner{width:min(1280px,100%);margin:auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}.sticky-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sticky-controls{display:flex;gap:8px}.sticky button{width:42px;height:42px}
.modal{position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.82);display:none;padding:18px}.modal.open{display:grid;place-items:center}.modal-box{width:min(900px,100%);height:min(820px,92vh);background:#fff;color:#111;border-radius:22px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#10283a;color:#fff}.modal-head h3{margin:0}.close{border:0;background:#fff;color:#111;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}.lyrics-frame{width:100%;height:100%;border:0;background:#fff}.lyrics-text{white-space:pre-wrap;padding:24px;overflow:auto;font-size:18px;line-height:1.7}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.now{grid-template-columns:210px 1fr}.list{max-height:430px}}
@media(max-width:650px){.app{width:min(100% - 14px,1280px);padding-top:8px}.hero{padding:18px}.toolbar{grid-template-columns:1fr}.now{grid-template-columns:1fr}.cover{width:min(78vw,310px);margin:auto}.sticky-inner{grid-template-columns:minmax(0,1fr) auto}.filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.chip{white-space:nowrap}.cards{grid-template-columns:1fr 1fr}.card{padding:10px}.mini-cover{height:95px}.card-actions{display:block}.small-btn{width:100%;margin-top:5px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <h1>🎵 MusikBox</h1>
  <p>Alle Songs an einem Ort – frei auswählen, anhören, zufällig entdecken und Songtexte öffnen.</p>
</header>

<section class="toolbar">
  <input id="search" class="search" type="search" placeholder="Titel suchen …" aria-label="Songs durchsuchen">
  <div class="filters" id="filters">
    <button class="chip active" data-filter="Alle">Alle</button>
    <button class="chip" data-filter="Songseiten mit Lyrics">Mit Lyrics</button>
    <button class="chip" data-filter="Weitere Songs">Weitere Songs</button>
    <button class="chip" data-filter="Projekt-Songs">Projekt-Songs</button>
  </div>
</section>

<div class="filters" style="margin-bottom:18px">
  <button id="playAll" class="action">▶ Alle abspielen</button>
  <button id="surprise" class="action magenta">🎲 Überrasch mich</button>
  <button id="shuffleTop" class="action">🔀 Zufallsmodus</button>
  <button id="repeatTop" class="action">🔁 Wiederholen</button>
</div>

<div class="layout">
  <section class="panel now">
    <div id="cover" class="cover" aria-label="Cover des aktuellen Songs"></div>
    <div class="meta">
      <div class="eyebrow">Jetzt ausgewählt</div>
      <h2 id="nowTitle">Botschafter sein</h2>
      <div id="nowCategory" class="category">Songseiten mit Lyrics</div>
      <div class="controls">
        <button id="shuffle" class="round" title="Zufallsmodus">🔀</button>
        <button id="prev" class="round" title="Vorheriger Song">⏮</button>
        <button id="play" class="round main" title="Wiedergabe">▶</button>
        <button id="next" class="round" title="Nächster Song">⏭</button>
        <button id="repeat" class="round" title="Wiederholen">🔁</button>
      </div>
      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Abspielposition">
        <span id="duration">0:00</span>
      </div>
      <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value=".85" aria-label="Lautstärke"></div>
      <button id="lyricsBtn" class="lyrics-btn">📝 Songtext ansehen</button>
    </div>
  </section>

  <aside class="panel">
    <div class="playlist-head"><h3>Playlist</h3><span id="count" class="count">19 Songs</span></div>
    <div id="playlist" class="list"></div>
  </aside>
</div>

<section class="library">
  <h3>Freie Auswahl</h3>
  <div id="cards" class="cards"></div>
</section>
</div>

<audio id="audio" preload="metadata"></audio>

<div class="sticky">
  <div class="sticky-inner">
    <div class="sticky-title"><strong id="stickyTitle">Botschafter sein</strong><br><small id="stickyCategory" style="color:#a9bbc8">Songseiten mit Lyrics</small></div>
    <div class="sticky-controls">
      <button id="stickyPrev" class="round" title="Zurück">⏮</button>
      <button id="stickyPlay" class="round main" title="Play/Pause">▶</button>
      <button id="stickyNext" class="round" title="Weiter">⏭</button>
    </div>
  </div>
</div>

<div id="lyricsModal" class="modal" role="dialog" aria-modal="true" aria-label="Songtext">
  <div class="modal-box">
    <div class="modal-head"><h3 id="lyricsTitle">Songtext</h3><button id="closeLyrics" class="close" aria-label="Schließen">×</button></div>
    <iframe id="lyricsFrame" class="lyrics-frame" title="Songtext-Seite"></iframe>
  </div>
</div>

<script>
const songs = [
 {title:"Botschafter sein",category:"Songseiten mit Lyrics",audio:"../../library/music/botschafter-sein.mp3",lyrics:"../botschafter-sein.html"},
 {title:"Das was war, ist jetzt vorbei",category:"Songseiten mit Lyrics",audio:"../../library/music/das-was-war-ist-jetzt-vorbei.mp3",lyrics:"../das-was-war-ist-jetzt-vorbei.html"},
 {title:"Jetzt nach vorn",category:"Songseiten mit Lyrics",audio:"../../library/music/jetzt-nach-vorn.mp3",lyrics:"../jetzt-nach-vorn.html"},
 {title:"Was von uns bleibt",category:"Songseiten mit Lyrics",audio:"../../library/music/was-von-uns-bleibt.mp3",lyrics:"../was-von-uns-bleibt.html"},
 {title:"Stille Revolution",category:"Songseiten mit Lyrics",audio:"../../library/music/stille-revolution.mp3",lyrics:"../stille-revolution.html"},
 {title:"Die Rückeroberung der eigenen Souveränität",category:"Songseiten mit Lyrics",audio:"../../library/music/die-rueckeroberung-der-eigenen-souveraenitaet.mp3",lyrics:"../die-rueckeroberung-der-eigenen-souveraenitaet.html"},
 {title:"Der nächste Schritt",category:"Songseiten mit Lyrics",audio:"../../library/music/der-naechste-schritt.mp3",lyrics:"../der-naechste-schritt.html"},
 {title:"Die Seele erwacht",category:"Weitere Songs",audio:"../../library/music/die-seele-erwacht.mp3"},
 {title:"Wir gehen jetzt los",category:"Weitere Songs",audio:"../../library/music/wir-gehen-jetzt-los.mp3",lyrics:"../wir-gehen-jetzt-los.html"},
 {title:"The Power of LiquidityBooster",category:"Weitere Songs",audio:"../../library/music/the-power-of-liquiditybooster.mp3",lyrics:"../the-power-of-liquiditybooster.html"},
 {title:"Der Club Marktplatz",category:"Weitere Songs",audio:"../../library/music/der-club-marktplatz.mp3"},
 {title:"Dienstag um 18 Uhr",category:"Weitere Songs",audio:"../../library/music/dienstag-um-18-uhr.mp3"},
 {title:"Herz aus Freiheit",category:"Weitere Songs",audio:"../../library/music/herz-aus-freiheit.mp3"},
 {title:"Wenn die Seele wieder tanzt",category:"Weitere Songs",audio:"../../library/music/wenn-die-seele-wieder-tanzt.mp3"},
 {title:"Wieder aufstehen",category:"Weitere Songs",audio:"../../library/music/wieder-aufstehen.mp3"},
 {title:"Mission Dorade – Jetzt geht es los",category:"Projekt-Songs",audio:"../club-promotion/mission-dorade-fokus-v10/jetzt-geht-es-los.mp3"},
 {title:"Mission Dorade – Vom Ich zum Wir (Remastered)",category:"Projekt-Songs",audio:"../mission-dorade-live/vom-ich-zum-wir-(remastered).mp3"},
 {title:"Club Promotion Hymne",category:"Projekt-Songs",audio:"../promotion/club-Promotion/club-promotion-hymne.mp3"},
 {title:"Club Promotion – Dein Anfang (Polonaise)",category:"Projekt-Songs",audio:"../promotion/club-Promotion/club-promotion---dein-anfang---polonaise.mp3"}
];

const $=s=>document.querySelector(s), audio=$("#audio");
let current=0, shuffle=false, repeat=false, activeFilter="Alle", query="";
const fmt=s=>!isFinite(s)?"0:00":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function visibleSongs(){return songs.map((s,i)=>({...s,i})).filter(s=>(activeFilter==="Alle"||s.category===activeFilter)&&s.title.toLowerCase().includes(query.toLowerCase()))}
function setSong(i,autoplay=false){
 current=(i+songs.length)%songs.length; const s=songs[current];
 audio.src=s.audio; $("#nowTitle").textContent=s.title; $("#nowCategory").textContent=s.category;
 $("#stickyTitle").textContent=s.title; $("#stickyCategory").textContent=s.category;
 $("#lyricsBtn").disabled=!s.lyrics; $("#lyricsBtn").textContent=s.lyrics?"📝 Songtext ansehen":"Kein Songtext hinterlegt";
 document.title=`${s.title} · MusikBox`; render();
 if(autoplay) audio.play().catch(()=>{});
}
function togglePlay(){audio.paused?audio.play().catch(()=>{}):audio.pause()}
function next(){
 if(shuffle){let n=current;while(n===current&&songs.length>1)n=Math.floor(Math.random()*songs.length);setSong(n,true)}
 else setSong(current+1,true)
}
function prev(){if(audio.currentTime>4){audio.currentTime=0;return}setSong(current-1,true)}
function updateButtons(){
 const playing=!audio.paused;
 $("#play").textContent=$("#stickyPlay").textContent=playing?"⏸":"▶";
 $("#shuffle").classList.toggle("active",shuffle);$("#shuffleTop").classList.toggle("active",shuffle);
 $("#repeat").classList.toggle("active",repeat);$("#repeatTop").classList.toggle("active",repeat)
}
function render(){
 const v=visibleSongs();$("#count").textContent=`${v.length} von ${songs.length} Songs`;
 $("#playlist").innerHTML=v.length?v.map(s=>`<div class="track ${s.i===current?"current":""}" data-i="${s.i}"><div class="num">${s.i===current?"▶":s.i+1}</div><div><div class="track-title">${s.title}</div><div class="track-cat">${s.category}</div></div><div class="lyric-mark">${s.lyrics?"📝":""}</div></div>`).join(""):`<div class="empty">Keine passenden Songs gefunden.</div>`;
 $("#cards").innerHTML=v.map(s=>`<article class="card" data-i="${s.i}"><div class="mini-cover">♫</div><h4>${s.title}</h4><p>${s.category}</p><div class="card-actions"><button class="small-btn play-card" data-i="${s.i}">▶ Anhören</button>${s.lyrics?`<button class="small-btn lyric-card" data-i="${s.i}">📝 Text</button>`:""}</div></article>`).join("");
 document.querySelectorAll(".track").forEach(el=>el.onclick=()=>setSong(+el.dataset.i,true));
 document.querySelectorAll(".play-card").forEach(el=>el.onclick=e=>{e.stopPropagation();setSong(+el.dataset.i,true)});
 document.querySelectorAll(".lyric-card").forEach(el=>el.onclick=e=>{e.stopPropagation();openLyrics(+el.dataset.i)});
 document.querySelectorAll(".card").forEach(el=>el.onclick=()=>setSong(+el.dataset.i,false));
}
function openLyrics(i=current){
 const s=songs[i];if(!s.lyrics)return;$("#lyricsTitle").textContent=s.title;$("#lyricsFrame").src=s.lyrics;$("#lyricsModal").classList.add("open");document.body.style.overflow="hidden";
}
function closeLyrics(){$("#lyricsModal").classList.remove("open");$("#lyricsFrame").src="about:blank";document.body.style.overflow=""}
$("#play").onclick=$("#stickyPlay").onclick=togglePlay;$("#prev").onclick=$("#stickyPrev").onclick=prev;$("#next").onclick=$("#stickyNext").onclick=next;
$("#playAll").onclick=()=>setSong(0,true);$("#surprise").onclick=()=>setSong(Math.floor(Math.random()*songs.length),true);
function toggleShuffle(){shuffle=!shuffle;updateButtons()}function toggleRepeat(){repeat=!repeat;audio.loop=repeat;updateButtons()}
$("#shuffle").onclick=$("#shuffleTop").onclick=toggleShuffle;$("#repeat").onclick=$("#repeatTop").onclick=toggleRepeat;
$("#search").oninput=e=>{query=e.target.value;render()};
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeFilter=b.dataset.filter;render()});
$("#volume").oninput=e=>audio.volume=+e.target.value;
$("#progress").oninput=e=>{if(audio.duration)audio.currentTime=(+e.target.value/1000)*audio.duration};
audio.ontimeupdate=()=>{$("#currentTime").textContent=fmt(audio.currentTime);$("#duration").textContent=fmt(audio.duration);$("#progress").value=audio.duration?audio.currentTime/audio.duration*1000:0};
audio.onloadedmetadata=()=>$("#duration").textContent=fmt(audio.duration);
audio.onplay=audio.onpause=updateButtons;audio.onended=()=>{if(!repeat)next()};
audio.onerror=()=>{console.warn("Audiodatei konnte nicht geladen werden:",songs[current].audio)};
$("#lyricsBtn").onclick=()=>openLyrics();$("#closeLyrics").onclick=closeLyrics;$("#lyricsModal").onclick=e=>{if(e.target.id==="lyricsModal")closeLyrics()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLyrics();if(e.code==="Space"&&!["INPUT","BUTTON"].includes(document.activeElement.tagName)){e.preventDefault();togglePlay()}});
audio.volume=.85;setSong(0,false);
</script>
</body>
</html>
