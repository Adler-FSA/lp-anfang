<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mission Dorade – Cockpit</title></head><body><script>(async()=>{const source='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/6863ba9238af0a3e286fca1854dea07a228a5dc6/pages/mission-dorade-cockpit/index.html';let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Cockpit konnte nicht geladen werden');return r.text()});const oldDe='Starte deinen Tag, öffne Präsentationen, nutze Simulatoren, arbeite an deinen Fähigkeiten und teile deinen persönlichen Mission-Dorade-Link – direkt aus einem zentralen Bereich.';const newDe='Starte deinen Tag, öffne Präsentationen, nutze Simulatoren und entwickle deine Mission Schritt für Schritt – alles an einem zentralen Ort.';const oldEn='Start your day, open presentations, use simulators, develop your skills and share your personal Mission Dorade link – all from one central area.';const newEn='Start your day, open presentations, use simulators and develop your mission step by step – all in one central place.';html=html.split(oldDe).join(newDe).split(oldEn).join(newEn);const logoCss='.hero-logo{position:absolute;z-index:3;right:clamp(70px,9vw,135px);top:52%;transform:translateY(-45%);width:clamp(230px,25vw,365px);max-height:72%;object-fit:contain;filter:drop-shadow(0 16px 32px rgba(0,0,0,.28));opacity:.97}.hero-inner{padding-right:clamp(390px,34vw,520px)}@media(max-width:1050px){.hero-logo{right:44px;width:clamp(190px,27vw,290px)}.hero-inner{padding-right:clamp(310px,35vw,390px)}}@media(max-width:780px){.hero-logo{display:none}.hero-inner{padding-right:18px}}';html=html.replace('</style>',logoCss+'</style>');html=html.replace('<div class="lang-zone">','<img class="hero-logo" src="../mission-dorade/Mission-Dorade-Premium-Logo.png" alt="Mission Dorade"><div class="lang-zone">');document.open();document.write(html);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:Arial;padding:24px">Das Mission-Dorade-Cockpit konnte nicht geladen werden. Bitte aktualisiere die Seite.</p>'})</script></body></html>
