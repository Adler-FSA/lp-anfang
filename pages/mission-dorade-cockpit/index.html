const breakfastHtml=`<section class="breakfast-wrap" id="missionBreakfast"><div class="breakfast"><div class="breakfast-main"><div><div class="breakfast-kicker" data-breakfast="kicker">Gemeinsam in den Tag starten</div><h2 data-breakfast="title">Das Mission-Dorade-Frühstück</h2><p class="breakfast-lead" data-breakfast="lead">Jeder erfolgreiche Tag beginnt mit einem guten Start. Von Montag bis Freitag frühstücken wir gemeinsam, tauschen Erfahrungen aus, beantworten Fragen und richten uns auf die nächsten Schritte aus. Ob du gerade erst gestartet bist oder schon länger dabei bist – jeder ist willkommen.</p><div class="breakfast-time" data-breakfast="time">Montag bis Freitag · 09:00–10:00 Uhr</div></div><aside class="breakfast-status"><div class="status-label" data-breakfast="statusLabel">Nächstes gemeinsames Frühstück</div><div class="status-title" id="breakfastStatusTitle">Beginnt in</div><div class="countdown" id="breakfastCountdown">--:--:--</div><a class="zoom-join" id="breakfastJoin" href="https://zoom.us/j/98106167573?pwd=2MWnNTN9TQDXabd80ev6My6cWADRYB.1" target="_blank" rel="noopener" data-breakfast="join">Zoom-Raum öffnen</a></aside></div><div class="zoom-backgrounds"><p class="zoom-backgrounds-intro" data-breakfast="backgroundIntro">Ein gemeinsamer Auftritt schafft Wiedererkennung. Nutze gerne einen unserer offiziellen Hintergründe für den gemeinsamen Frühstücksraum und deine Mission-Dorade-Gespräche.</p><details class="zoom-details"><summary data-breakfast="bg1">Zoom-Raum Hintergrundbild 1</summary><div class="zoom-content"><img src="../mission-dorade/mission-dorade-die-reise.jpeg" alt="Mission Dorade Zoom-Raum Hintergrundbild 1"><a class="download-bg" href="../mission-dorade/mission-dorade-die-reise.jpeg" download data-breakfast="download">Hintergrundbild herunterladen</a></div></details><details class="zoom-details"><summary data-breakfast="bg2">Zoom-Raum Hintergrundbild 2</summary><div class="zoom-content"><img src="/lp-anfang/library/images/zoom-raum-hin
