<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Dorade – Cockpit</title>
</head>
<body>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/6863ba9238af0a3e286fca1854dea07a228a5dc6/pages/mission-dorade-cockpit/index.html';
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Cockpit konnte nicht geladen werden');
      return r.text();
    });

    const workspaceScript='<scr'+'ipt src="https://adler-fsa.github.io/lp-anfang/pages/mission-dorade-cockpit/presentation-workspace-fit.js?nocache=202607260800"></scr'+'ipt>';
    const breakfastScript='<scr'+'ipt src="https://adler-fsa.github.io/lp-anfang/pages/mission-dorade-cockpit/breakfast-module.js?nocache=202607260800"></scr'+'ipt>';
    html=html.replace('</body>',workspaceScript+breakfastScript+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<p style="font-family:Arial;padding:24px">Das Mission-Dorade-Cockpit konnte nicht geladen werden. Bitte aktualisiere die Seite.</p>';
  }
})();
</script>
</body>
</html>
