<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Dorade – Cockpit</title>
</head>
<body>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/bd7b77b89f27742c0a80772f6b77038c5d025352/pages/mission-dorade-cockpit/index.html';
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Cockpit konnte nicht geladen werden');
      return r.text();
    });
    html=html.replace('</body>','<script src="https://adler-fsa.github.io/lp-anfang/pages/mission-dorade-cockpit/external-presentations.js?nocache=202607260020"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<p style="font-family:Arial;padding:24px">Das Mission-Dorade-Cockpit konnte nicht geladen werden. Bitte aktualisiere die Seite.</p>';
  }
})();
</script>
</body>
</html>
