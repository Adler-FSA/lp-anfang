<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Dorade – Spielregeln, Simulator & Jackpot</title>
</head>
<body>
<script>
(async()=>{
  const embedded=window.self!==window.top;
  const source='https://raw.githubusercontent.com/Adler-FSA/lp-anfang/4e5c550406f98a179f91d0cab4b3a4dffe5c4eaf/pages/schnellstart-mission-dorade-simulator/index.html';
  try{
    let html=await fetch(source,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Schnellstart konnte nicht geladen werden');
      return r.text();
    });

    if(embedded){
      html=html.replace('<html lang="de">','<html lang="de" class="embedded">');
      const css=`<style id="iframe-compat">
html.embedded,html.embedded body{width:100%!important;height:100%!important;min-height:0!important;overflow:hidden!important}
html.embedded .app{width:100%!important;height:100%!important;max-height:100%!important;min-height:0!important;overflow:hidden!important}
html.embedded .stage,html.embedded .scene,html.embedded .scene-content,html.embedded .scene-art,html.embedded .sim-wrap,html.embedded .sim-panel,html.embedded .result-panel{min-width:0!important;min-height:0!important;max-height:100%!important}
html.embedded .stage{height:100%!important}
html.embedded .bottom-nav{min-width:0!important;flex-shrink:0!important}
html.embedded .scene-art svg,html.embedded img{max-width:100%!important;max-height:100%!important}
html.embedded .sim-panel,html.embedded .result-panel{overflow:auto!important}
</style>`;
      html=html.replace('</head>',css+'</head>');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<p style="font-family:Arial;padding:24px">Der Mission-Dorade-Schnellstart konnte nicht geladen werden. Bitte aktualisiere die Seite.</p>';
  }
})();
</script>
</body>
</html>
