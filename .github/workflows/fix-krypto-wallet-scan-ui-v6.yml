name: Fix Krypto Wallet Scan UI V6
on:
  push:
    paths:
      - '.github/workflows/fix-krypto-wallet-scan-ui-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan-Ablauf reparieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/krypto-steuer-assistent-v2/index.html')
          s=p.read_text(encoding='utf-8')
          marker='WALLET_SCAN_UI_V6'
          if marker in s:
              raise SystemExit(0)
          old="async function rpcCall(url,method,params,timeout=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'RPC-Fehler');return j.result}finally{clearTimeout(timer)}}"
          new="/* WALLET_SCAN_UI_V6 */\nasync function rpcCall(url,method,params,timeout=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout),hard=new Promise((_,reject)=>setTimeout(()=>reject(Error('Zeitüberschreitung')),timeout+1500));try{const request=fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:c.signal}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'RPC-Fehler');return j.result});return await Promise.race([request,hard])}finally{clearTimeout(timer)}}"
          if old not in s:
              raise SystemExit('rpcCall-Anker fehlt')
          s=s.replace(old,new,1)
          old2="const chain=input.mode==='auto'?(kind==='bitcoin'?'bitcoin':kind==='solana'?'solana':kind==='tron'?'tron':'ethereum'):input.mode;const label=EVM_CHAINS.find(x=>x.id===chain)?.name||chain;const w={id:uid(),name:input.name,chain,chainName:label,address:input.address,ownership:input.ownership,exchangeId:input.exchangeId};data.wallets.push(w);$('waName').value=$('waAddress').value='';save();await lookup(w)}"
          new2="const chain=input.mode==='auto'?(kind==='bitcoin'?'bitcoin':kind==='solana'?'solana':kind==='tron'?'tron':'ethereum'):input.mode;const label=EVM_CHAINS.find(x=>x.id===chain)?.name||chain;const w={id:uid(),name:input.name,chain,chainName:label,address:input.address,ownership:input.ownership,exchangeId:input.exchangeId};data.wallets.push(w);$('waName').value=$('waAddress').value='';save();try{await lookup(w)}finally{const ok=!!w.lookup?.ok,tx=Number(w.lookup?.txCount||0),err=w.lookup?.historyError||w.lookup?.error||'';box.innerHTML=`<div class=\"notice\"><strong>${ok?'Prüfung abgeschlossen':'Prüfung beendet'}</strong><br>${ok?`${esc(label)} wurde erkannt${tx?` · ${tx} ausgehende Aktivität(en) gefunden`:''}.`:`${esc(label)} konnte derzeit nicht vollständig gelesen werden.`}${err?`<br><span class=\"help\">${esc(err)}</span>`:''}</div>`;renderSources();}}"
          if old2 not in s:
              raise SystemExit('manueller Scan-Anker fehlt')
          s=s.replace(old2,new2,1)
          old3="$('saveWallet').onclick=async()=>{const name=$('waName').value.trim(),address=$('waAddress').value.trim(),mode=$('waChain').value;if(!name||!address)return alert('Bitte Bezeichnung und öffentliche Wallet-Adresse eingeben.');await scanAndSaveWallet({name,address,mode,ownership:$('waOwner').value,exchangeId:$('waExchange').value})};"
          new3="$('saveWallet').onclick=async()=>{const btn=$('saveWallet'),name=$('waName').value.trim(),address=$('waAddress').value.trim(),mode=$('waChain').value;if(!name||!address)return alert('Bitte Bezeichnung und öffentliche Wallet-Adresse eingeben.');btn.disabled=true;const oldText=btn.textContent;btn.textContent='Wallet wird geprüft …';try{await Promise.race([scanAndSaveWallet({name,address,mode,ownership:$('waOwner').value,exchangeId:$('waExchange').value}),new Promise((_,reject)=>setTimeout(()=>reject(Error('Die Gesamtprüfung wurde nach 30 Sekunden beendet.')),30000))])}catch(e){const box=$('chainScanResult');if(box)box.innerHTML=`<div class=\"notice\"><strong>Prüfung beendet.</strong><br>${esc(e.message||e)} Bitte Explorer & CSV verwenden oder erneut versuchen.</div>`}finally{btn.disabled=false;btn.textContent=oldText}};"
          if old3 not in s:
              raise SystemExit('Button-Anker fehlt')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript prüfen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/krypto-steuer-assistent-v2/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('Script fehlt')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/krypto-steuer-assistent-v2/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Beendet Wallet-Prüfung zuverlässig und zeigt Ergebnis"
          git pull --rebase origin main
          git push origin HEAD:main
