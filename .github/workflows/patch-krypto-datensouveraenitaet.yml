name: Stabilitaet Krypto Steuer Akademie

on:
  push:
    paths:
      - '.github/workflows/patch-krypto-datensouveraenitaet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilitaets-Patch gezielt anwenden
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pages/krypto-steuer-assistent-v2/index.html')
          s = path.read_text(encoding='utf-8')

          # 1) LocalStorage-Fehler abfangen und Änderungen dauerhaft markieren.
          old_save = "function save(){store.active=active;store.years[active]=data;localStorage.setItem(KEY,JSON.stringify(store));markBackupDirty();render()}"
          new_save = "function save(){store.active=active;store.years[active]=data;if(!persistStore())return false;markBackupDirty();render();return true}"
          if old_save in s:
              s = s.replace(old_save, new_save, 1)

          # 2) Verknüpfte Daten beim Löschen nicht still verlieren.
          old_delete = "function bindDelete(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Diesen Eintrag wirklich löschen?'))return;const l=b.dataset.del,id=b.dataset.id;if(l==='wallets')data.transactions=data.transactions.filter(x=>x.walletId!==id);data[l]=data[l].filter(x=>x.id!==id);checks();save()})}"
          new_delete = "function bindDelete(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const l=b.dataset.del,id=b.dataset.id;if(l==='exchanges'){const e=data.exchanges.find(x=>x.id===id),r=relations().exchange(e||{id});const msg=`Anbieter ${e?.name||''} löschen? Zugeordnet sind ${r.wallets} Wallet(s), ${r.imports} CSV-Datei(en), ${r.bank} Bankbewegung(en) und ${r.tx} Transaktion(en). Diese Daten bleiben erhalten und werden als ungeklärt markiert.`;if(!confirm(msg))return;data.wallets.forEach(x=>{if(x.exchangeId===id)x.exchangeId=''});data.imports.forEach(x=>{if(x.exchangeId===id)x.exchangeId=''});data.bank.forEach(x=>{if(x.exchangeId===id)x.exchangeId=''});data.transactions.forEach(x=>{if(x.exchangeId===id)x.exchangeId=''});data.exchanges=data.exchanges.filter(x=>x.id!==id)}else if(l==='wallets'){const w=data.wallets.find(x=>x.id===id),n=data.transactions.filter(x=>x.walletId===id).length;if(!confirm(`Wallet ${w?.name||''} löschen? ${n} verknüpfte Transaktion(en) bleiben erhalten und werden als ungeklärt markiert.`))return;data.transactions.forEach(x=>{if(x.walletId===id)x.walletId=''});data.wallets=data.wallets.filter(x=>x.id!==id)}else{if(!confirm('Diesen Eintrag wirklich löschen?'))return;data[l]=data[l].filter(x=>x.id!==id)}checks();save()})}"
          if old_delete in s:
              s = s.replace(old_delete, new_delete, 1)

          # 3) Originaldatei-Hinweise direkt an den Uploads ergänzen.
          s = s.replace('Verwenden Sie möglichst den unveränderten Originalexport der Plattform.</span>', 'Verwenden Sie möglichst den unveränderten Originalexport der Plattform. Das Akademie-Backup speichert nur Struktur und Vorschau – die vollständige Original-CSV muss separat archiviert werden.</span>', 1)
          s = s.replace('<input id="docFile" type="file"></div>', '<input id="docFile" type="file"><span class="help">Im Akademie-Backup werden Dateiname und Zuordnung gespeichert, nicht der vollständige Dateiinhalt. Bewahren Sie den Beleg zusätzlich im Archivordner auf.</span></div>', 1)

          # 4) Blockchain-Abfrage mit Zeitlimit und verständlicher Diagnose.
          old_fetch = "const u=`https://api.blockchair.com/${encodeURIComponent(w.chain)}/dashboards/address/${encodeURIComponent(w.address)}?limit=20`,res=await fetch(u,{headers:{Accept:'application/json'}});if(!res.ok)throw Error('Antwort '+res.status);"
          new_fetch = "const u=`https://api.blockchair.com/${encodeURIComponent(w.chain)}/dashboards/address/${encodeURIComponent(w.address)}?limit=20`,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);let res;try{res=await fetch(u,{headers:{Accept:'application/json'},signal:controller.signal})}catch(err){if(err.name==='AbortError')throw Error('Die Blockchain-Abfrage hat länger als 15 Sekunden gedauert. Bitte Internetverbindung prüfen und erneut versuchen.');throw Error('Die externe Blockchain-Abfrage ist derzeit nicht erreichbar.')}finally{clearTimeout(timer)}if(!res.ok)throw Error('Blockchain-Dienst antwortet mit Status '+res.status);"
          if old_fetch in s:
              s = s.replace(old_fetch, new_fetch, 1)

          # 5) Bisherige Sicherungslogik komplett durch dauerhafte Änderungs-/Backup-Zeitpunkte ersetzen.
          start = s.find("const BACKUP_META='kryptoSteuerBackupMeta';")
          end = s.find("buildNav();wire();updateExchangeHelp();checks();render();wireSafety();", start)
          if start != -1 and end != -1:
              safety = r'''const BACKUP_META='kryptoSteuerBackupMeta';
          function backupMeta(){try{return JSON.parse(localStorage.getItem(BACKUP_META)||'{}')}catch{return{}}}
          function saveBackupMeta(m){try{localStorage.setItem(BACKUP_META,JSON.stringify(m));return true}catch(e){alert('Der Browser konnte den Sicherungsstatus nicht speichern. Bitte jetzt ein Backup herunterladen.');return false}}
          function persistStore(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){const msg=e?.name==='QuotaExceededError'?'Der lokale Browserspeicher ist voll. Bitte sofort ein Backup herunterladen und nicht mehr benötigte Browserdaten oder sehr große Importvorschauen prüfen.':'Die Daten konnten in diesem Browser nicht gespeichert werden. Bitte sofort ein Backup herunterladen.';alert(msg);return false}}
          function markBackupDirty(){const m=backupMeta(),now=new Date().toISOString();m.lastChange=now;m.dirtySince=m.dirtySince||now;saveBackupMeta(m);renderBackupState()}
          function backupStamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
          function isCurrentBackup(m=backupMeta()){return !!(m.lastBackup&&m.lastChange&&new Date(m.lastBackup)>=new Date(m.lastChange))}
          function downloadBackup(){store.active=active;store.years[active]=data;if(!persistStore())return;const createdAt=new Date().toISOString(),payload={format:'Krypto-Steuer-Akademie-Backup',version:2,createdAt,data:store},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Krypto-Steuer-Akademie_${backupStamp()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);const m=backupMeta();m.lastBackup=createdAt;m.file=a.download;delete m.dirtySince;saveBackupMeta(m);renderBackupState();notify('Backup-Download wurde gestartet. Bitte die Datei sicher archivieren.')}
          function renderBackupState(){const m=backupMeta(),last=m.lastBackup?new Date(m.lastBackup):null,changed=m.lastChange?new Date(m.lastChange):null,current=isCurrentBackup(m),l=$('backupLamp'),t=$('backupText');if(l&&t){if(!last){l.className='status bad';l.textContent='🔴 Noch nie gesichert';t.textContent='Letzte Sicherung: keine Sicherung bekannt'}else if(current){l.className='status ok';l.textContent='🟢 Aktueller Stand gesichert';t.textContent='Letzte Sicherung: '+last.toLocaleString('de-DE')}else{l.className='status warn';l.textContent='🟡 Neue Änderungen ungesichert';t.textContent='Letzte Sicherung: '+last.toLocaleString('de-DE')+(changed?' · letzte Änderung: '+changed.toLocaleString('de-DE'):'')}}const mins=m.dirtySince?(Date.now()-new Date(m.dirtySince).getTime())/60000:0;document.querySelectorAll('[data-backup]').forEach(b=>{b.classList.toggle('remind30',!current&&mins>=30&&mins<45);b.classList.toggle('remind45',!current&&mins>=45)})}
          function openSafety(id){$(id).hidden=false}function closeSafety(id){$(id).hidden=true}
          function storageDiagnostic(){try{const bytes=new Blob([localStorage.getItem(KEY)||'']).size,kb=Math.round(bytes/1024),el=$('storageInfo');if(el)el.textContent=`Aktuell belegt die Steuerakte ungefähr ${kb.toLocaleString('de-DE')} KB lokalen Browserspeicher.`}catch{}}
          function wireSafety(){document.querySelectorAll('[data-backup]').forEach(b=>b.onclick=downloadBackup);$('restoreOpen').onclick=()=>openSafety('restoreModal');$('archiveOpen').onclick=()=>openSafety('archiveModal');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSafety(b.dataset.close));$('restoreNow').onclick=()=>{const f=$('restoreFile').files[0];if(!f)return alert('Bitte zuerst eine Backup-Datei auswählen.');const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),d=p.format==='Krypto-Steuer-Akademie-Backup'?p.data:p;if(!d||typeof d!=='object'||!d.years)throw Error();if(!confirm('Die lokalen Daten dieses Browsers durch das ausgewählte Backup ersetzen?'))return;localStorage.setItem(KEY,JSON.stringify(d));const now=new Date().toISOString();saveBackupMeta({lastBackup:p.createdAt||now,lastChange:p.createdAt||now,restoredAt:now,file:f.name});location.reload()}catch(e){alert(e?.name==='QuotaExceededError'?'Das Backup ist größer als der verfügbare Browserspeicher.':'Diese Datei ist kein gültiges Backup der Krypto-Steuer-Akademie.')}};r.readAsText(f)};renderBackupState();storageDiagnostic();setInterval(()=>{renderBackupState();storageDiagnostic()},30000);window.addEventListener('beforeunload',e=>{if(!isCurrentBackup()){e.preventDefault();e.returnValue='Seit der letzten Sicherung wurden Änderungen vorgenommen.'}});if('serviceWorker'in navigator&&window.top===window.self)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
          '''
              s = s[:start] + safety + s[end:]

          # 6) Speicherdiagnose sichtbar in Kapitel 0 ergänzen.
          marker = '<div class="notice" style="margin-top:14px"><strong>Tagesregel:</strong>'
          if 'id="storageInfo"' not in s and marker in s:
              s = s.replace(marker, '<p id="storageInfo" class="help" style="margin-top:14px"></p>'+marker, 1)

          path.write_text(s, encoding='utf-8')

          # 7) Konservativer Service Worker: online immer Netzwerk zuerst, offline letzter Stand.
          sw = Path('pages/krypto-steuer-assistent-v2/sw.js')
          sw.write_text("""const CACHE='krypto-steuer-akademie-v1';\nself.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.add('./index.html')).catch(()=>{}))});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET'||new URL(e.request.url).origin!==location.origin)return;const u=new URL(e.request.url);u.search='';const key=new Request(u.toString(),{method:'GET',headers:e.request.headers,mode:e.request.mode,credentials:e.request.credentials,redirect:e.request.redirect});e.respondWith(fetch(e.request).then(r=>{if(r&&r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(key,copy))}return r}).catch(()=>caches.match(key).then(r=>r||caches.match('./index.html'))))});\n""",encoding='utf-8')
          PY
      - name: Änderungen prüfen und committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/krypto-steuer-assistent-v2/index.html pages/krypto-steuer-assistent-v2/sw.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi
          git commit -m "Stabilisiert Backup, Datenverknüpfungen, Speicher und Offline-Fallback"
          git push
