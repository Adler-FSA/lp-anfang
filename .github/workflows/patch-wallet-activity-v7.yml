name: Patch Wallet Activity V7
on:
  push:
    paths:
      - '.github/workflows/patch-wallet-activity-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch anwenden
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: JavaScript prüfen
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          s=Path('pages/krypto-steuer-assistent-v2/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('Script fehlt')
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY2
          node --check /tmp/app.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/krypto-steuer-assistent-v2/index.html
          git commit -m 'Zeigt Wallet-Bewegungen und liest alle Blockchain-Datenarten'
          git pull --rebase origin main
          git push origin HEAD:main
