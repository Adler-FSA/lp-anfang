name: Patch Krypto Multi-Chain Wallet

on:
  push:
    paths:
      - '.github/workflows/patch-krypto-multichain-wallet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Multi-Chain-Transaktionen mit der Steuerakte verbinden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/krypto-steuer-assistent-v2/index.html')
          s = path.read_text(encoding='utf-8')

          if 'MULTICHAIN_TX_SYNC_V2' in s:
              print('Multi-Chain-Transaktionssync V2 ist bereits vorhanden.')
              raise SystemExit(0)
          if 'MULTICHAIN_WALLET_V1' not in s:
              raise SystemExit('Multi-Chain-Wallet-Scanner V1 wurde nicht gefunden.')

          s = s.replace('/* MULTICHAIN_WALLET_V1 */', '/* MULTICHAIN_WALLET_V1 */\n/* MULTICHAIN_TX_SYNC_V2 */', 1)

          old_chains = """{id:'ethereum',name:'Ethereum',symbol:'ETH',rpc:'https://eth.llamarpc.com'},
            {id:'bsc',name:'BNB Smart Chain',symbol:'BNB',rpc:'https://bsc-dataseed.binance.org'},
            {id:'polygon',name:'Polygon',symbol:'POL',rpc:'https://polygon-rpc.com'},
            {id:'arbitrum',name:'Arbitrum One',symbol:'ETH',rpc:'https://arb1.arbitrum.io/rpc'},
            {id:'optimism',name:'Optimism',symbol:'ETH',rpc:'https://mainnet.optimism.io'},
            {id:'base',name:'Base',symbol:'ETH',rpc:'https://mainnet.base.org'},
            {id:'avalanche',name:'Avalanche C-Chain',symbol:'AVAX',rpc:'https://api.avax.network/ext/bc/C/rpc'},
            {id:'fantom',name:'Fantom',symbol:'FTM',rpc:'https://rpc.ftm.tools'},
            {id:'gnosis',name:'Gnosis Chain',symbol:'xDAI',rpc:'https://rpc.gnosischain.com'},
            {id:'linea',name:'Linea',symbol:'ETH',rpc:'https://rpc.linea.build'},
            {id:'zksync',name:'zkSync Era',symbol:'ETH',rpc:'https://mainnet.era.zksync.io'},
            {id:'cronos',name:'Cronos',symbol:'CRO',rpc:'https://evm.cronos.org'}"""
          new_chains = """{id:'ethereum',name:'Ethereum',symbol:'ETH',rpc:'https://eth.llamarpc.com',explorer:'https://eth.blockscout.com'},
            {id:'bsc',name:'BNB Smart Chain',symbol:'BNB',rpc:'https://bsc-dataseed.binance.org',explorer:'https://bsc.blockscout.com'},
            {id:'polygon',name:'Polygon',symbol:'POL',rpc:'https://polygon-rpc.com',explorer:'https://polygon.blockscout.com'},
            {id:'arbitrum',name:'Arbitrum One',symbol:'ETH',rpc:'https://arb1.arbitrum.io/rpc',explorer:'https://arbitrum.blockscout.com'},
            {id:'optimism',name:'Optimism',symbol:'ETH',rpc:'https://mainnet.optimism.io',explorer:'https://optimism.blockscout.com'},
            {id:'base',name:'Base',symbol:'ETH',rpc:'https://mainnet.base.org',explorer:'https://base.blockscout.com'},
            {id:'avalanche',name:'Avalanche C-Chain',symbol:'AVAX',rpc:'https://api.avax.network/ext/bc/C/rpc',explorer:'https://avalanche.blockscout.com'},
            {id:'fantom',name:'Fantom',symbol:'FTM',rpc:'https://rpc.ftm.tools'},
            {id:'gnosis',name:'Gnosis Chain',symbol:'xDAI',rpc:'https://rpc.gnosischain.com',explorer:'https://gnosis.blockscout.com'},
            {id:'linea',name:'Linea',symbol:'ETH',rpc:'https://rpc.linea.build',explorer:'https://linea.blockscout.com'},
            {id:'zksync',name:'zkSync Era',symbol:'ETH',rpc:'https://mainnet.era.zksync.io',explorer:'https://zksync.blockscout.com'},
            {id:'cronos',name:'Cronos',symbol:'CRO',rpc:'https://evm.cronos.org',explorer:'https://cronos.blockscout.com'}"""
          if old_chains not in s:
              raise SystemExit('EVM-Chainliste nicht gefunden')
          s = s.replace(old_chains, new_chains, 1)

          marker = "function renderChainScan(results,kind)"
          helpers = r'''
          function lowerAddress(v){return String(v||'').toLowerCase()}
          function decimalAmount(raw,decimals=18){try{raw=String(raw||'0');decimals=Number(decimals||0);if(!/^\d+$/.test(raw))return raw;const neg=false,p=raw.padStart(decimals+1,'0'),i=p.slice(0,-decimals)||'0',f=decimals?p.slice(-decimals).replace(/0+$/,''):'';return f?i+'.'+f:i}catch{return String(raw||'')}}
          async function explorerJson(url,timeout=18000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{headers:{Accept:'application/json'},signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
          function upsertBlockchainTx(tx){if(!tx.blockchainKey)return false;const old=data.transactions.find(x=>x.blockchainKey===tx.blockchainKey);if(old){Object.assign(old,tx,{id:old.id});return false}data.transactions.push(tx);return true}
          function nativeTxFromExplorer(item,chain,wallet){const from=lowerAddress(item.from?.hash||item.from),to=lowerAddress(item.to?.hash||item.to),mine=lowerAddress(wallet.address),out=from===mine,incoming=to===mine;return{id:uid(),date:item.timestamp||'',type:out?'Auszahlung':incoming?'Einzahlung':'Blockchain-Vorgang',asset:chain.symbol,amount:decimalAmount(item.value||'0',18),eur:'',exchangeId:wallet.exchangeId||'',walletId:wallet.id,source:'Blockchain',notes:`${chain.name} · ${item.method||'native Transaktion'} · ${item.hash||''}`,auto:true,chain:chain.id,txHash:item.hash||'',direction:out?'ausgehend':incoming?'eingehend':'unbekannt',status:item.status||'',blockchainKey:`${chain.id}:${item.hash||''}:native`}}
          function tokenTxFromExplorer(item,chain,wallet){const token=item.token||{},total=item.total||{},from=lowerAddress(item.from?.hash||item.from),to=lowerAddress(item.to?.hash||item.to),mine=lowerAddress(wallet.address),out=from===mine,incoming=to===mine,hash=item.transaction_hash||item.tx_hash||item.hash||'';return{id:uid(),date:item.timestamp||'',type:out?'Auszahlung':incoming?'Einzahlung':'Token-Transfer',asset:token.symbol||token.name||'TOKEN',amount:decimalAmount(total.value||item.value||'0',total.decimals??token.decimals??0),eur:'',exchangeId:wallet.exchangeId||'',walletId:wallet.id,source:'Blockchain',notes:`${chain.name} · Token-Transfer · ${hash}`,auto:true,chain:chain.id,txHash:hash,direction:out?'ausgehend':incoming?'eingehend':'unbekannt',tokenAddress:token.address_hash||token.address||'',blockchainKey:`${chain.id}:${hash}:token:${item.log_index??item.index??token.address_hash??''}`}}
          async function importEvmHistory(chain,wallet){if(!chain.explorer)return{added:0,total:0,error:'Für dieses Netzwerk ist noch kein öffentlicher Transaktions-Explorer angebunden.'};try{const base=chain.explorer.replace(/\/$/,''),address=encodeURIComponent(wallet.address),[normal,token]=await Promise.allSettled([explorerJson(`${base}/api/v2/addresses/${address}/transactions`),explorerJson(`${base}/api/v2/addresses/${address}/token-transfers`)]);let added=0,total=0;if(normal.status==='fulfilled'){const items=Array.isArray(normal.value?.items)?normal.value.items:[];total+=items.length;items.slice(0,100).forEach(x=>{if(upsertBlockchainTx(nativeTxFromExplorer(x,chain,wallet)))added++})}if(token.status==='fulfilled'){const items=Array.isArray(token.value?.items)?token.value.items:[];total+=items.length;items.slice(0,100).forEach(x=>{if(upsertBlockchainTx(tokenTxFromExplorer(x,chain,wallet)))added++})}if(normal.status==='rejected'&&token.status==='rejected')throw Error('Transaktionshistorie derzeit nicht erreichbar');wallet.lookup=wallet.lookup||{};wallet.lookup.historyAt=new Date().toISOString();wallet.lookup.historyCount=total;wallet.lookup.importedCount=(wallet.lookup.importedCount||0)+added;return{added,total}}catch(e){wallet.lookup=wallet.lookup||{};wallet.lookup.historyError=String(e.message||e);return{added:0,total:0,error:String(e.message||e)}}}
          async function syncWalletHistory(wallet,quiet=false){const chain=EVM_CHAINS.find(c=>c.id===wallet.chain);if(!chain)return{added:0,total:0,error:'Keine EVM-Chain'};const r=await importEvmHistory(chain,wallet);checks();save();if(!quiet)notify(r.error?`${chain.name}: Aktivität erkannt, Transaktionsliste aber derzeit nicht erreichbar.`:`${chain.name}: ${r.total} Blockchain-Einträge gelesen, ${r.added} neu übernommen.`);return r}
          '''
          if marker not in s:
              raise SystemExit('Einfügepunkt für Transaktionsfunktionen nicht gefunden')
          s = s.replace(marker, helpers + marker, 1)

          old_scan_save = """hits.forEach(r=>{if(!data.wallets.some(w=>w.address.toLowerCase()===input.address.toLowerCase()&&w.chain===r.id)){data.wallets.push({id:uid(),name:`${input.name} – ${r.name}`,chain:r.id,chainName:r.name,address:input.address,ownership:input.ownership,exchangeId:input.exchangeId,lookup:{ok:true,at:new Date().toISOString(),txCount:r.txCount,balance:r.balanceWei,method:'multichain-rpc'}})}});$('waName').value=$('waAddress').value='';checks();save();notify(`${hits.length} Netzwerk(e) wurden für diese Wallet übernommen.`);return"""
          new_scan_save = """const wallets=[];hits.forEach(r=>{let w=data.wallets.find(w=>w.address.toLowerCase()===input.address.toLowerCase()&&w.chain===r.id);if(!w){w={id:uid(),name:`${input.name} – ${r.name}`,chain:r.id,chainName:r.name,address:input.address,ownership:input.ownership,exchangeId:input.exchangeId,lookup:{ok:true,at:new Date().toISOString(),txCount:r.txCount,balance:r.balanceWei,method:'multichain-rpc'}};data.wallets.push(w)}wallets.push(w)});$('waName').value=$('waAddress').value='';checks();save();let imported=0,total=0;for(const w of wallets){const r=await syncWalletHistory(w,true);imported+=r.added||0;total+=r.total||0}notify(`${hits.length} Netzwerk(e) übernommen · ${total} Blockchain-Einträge gelesen · ${imported} neu in Ihre Transaktionen eingefügt.`);go('ledger');return"""
          if old_scan_save not in s:
              raise SystemExit('Speicherlogik des Multi-Chain-Scanners nicht gefunden')
          s = s.replace(old_scan_save, new_scan_save, 1)

          old_evm_lookup = """w.lookup=r.ok?{ok:true,at:new Date().toISOString(),txCount:r.txCount,balance:r.balanceWei,method:'evm-rpc'}:{ok:false,error:r.error,at:new Date().toISOString()};checks();save();notify(r.ok?'Das Netzwerk wurde erneut geprüft.':'Das Netzwerk konnte derzeit nicht geprüft werden.');return"""
          new_evm_lookup = """w.lookup=r.ok?{ok:true,at:new Date().toISOString(),txCount:r.txCount,balance:r.balanceWei,method:'evm-rpc'}:{ok:false,error:r.error,at:new Date().toISOString()};if(r.ok){const h=await syncWalletHistory(w,true);notify(h.error?'Netzwerk erkannt; die Transaktionshistorie ist derzeit nicht erreichbar.':`${h.total} Blockchain-Einträge gelesen, ${h.added} neu übernommen.`)}else{checks();save();notify('Das Netzwerk konnte derzeit nicht geprüft werden.')}return"""
          if old_evm_lookup not in s:
              raise SystemExit('EVM-Neupruefung nicht gefunden')
          s = s.replace(old_evm_lookup, new_evm_lookup, 1)

          old_row = """Transaktionen ${x.tx} · offene Punkte ${x.reviews}</td><td><button class=\"btn ghost\" data-lookup=\"${w.id}\">Erneut lesen</button>"""
          new_row = """Transaktionen ${x.tx} · offene Punkte ${x.reviews}${w.lookup?.historyError?' · Historie nicht erreichbar':''}</td><td><button class=\"btn ghost\" data-lookup=\"${w.id}\">Neu prüfen & synchronisieren</button>"""
          if old_row in s:
              s = s.replace(old_row, new_row, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Änderungen committen
        run: |
          if git diff --quiet; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/krypto-steuer-assistent-v2/index.html
          git commit -m "Verbindet Multi-Chain-Wallets mit der Transaktionsübersicht"
          git push
