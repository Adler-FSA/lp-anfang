name: Dispatch Rebuild Krypto Wallet V5
on:
  push:
    paths:
      - '.github/workflows/dispatch-rebuild-krypto-wallet-v5.yml'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild-Workflow starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rebuild-krypto-wallet-engine-v5.yml --repo "${{ github.repository }}" --ref main
