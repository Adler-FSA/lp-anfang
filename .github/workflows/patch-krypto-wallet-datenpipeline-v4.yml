name: Patch Krypto Wallet Datenpipeline V4

on:
  push:
    paths:
      - '.github/workflows/patch-krypto-wallet-datenpipeline-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Professionelle Wallet-Datenpipeline einbauen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pages/krypto-steuer-assistent-v2/index.html')
          s=p.read_text(encoding='utf-8')
          if 'WALLET_DATA_PIPELINE_V4' in s:
              print('Pipeline bereits vorhanden')
              raise SystemExit(0)

          css='''
          /* WALLET_DATA_PIPELINE_V4 */
          .wallet-import-box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f7f9fa}.wallet-import-box input{display:block;width:100%;margin:10px 0}.pipeline-log{margin-top:10px;padding:10px;border-radius:11px;background:#fff;font-size:12px;line-height:1.5;white-space:pre-wrap}.status-stack{display:grid;gap:5px}.status-stack .status{width:max-content}
          '''
          s=s.replace('</style>',css+'</style>',1)

          old='<p class="explorer-note">Manche Explorer verhindern die Darstellung in eingebetteten Fenstern. In diesem Fall nutzen Sie „Im Explorer öffnen“. Dort sehen Sie die Originaldaten und erreichen – je nach Explorer – den CSV- oder Exportbereich.</p><iframe id="explorerFrame" class="explorer-frame" title="Blockchain-Explorer"></iframe>'
          new='''<p class="explorer-note">Manche Explorer verhindern die Darstellung in eingebetteten Fenstern. In diesem Fall nutzen Sie „Im Explorer öffnen“. Dort sehen Sie die Originaldaten und erreichen – je nach Explorer – den CSV- oder Exportbereich.</p><div class="wallet-import-box"><strong>Explorer-CSV dieser Wallet einlesen</strong><span class="help">Laden Sie im Explorer die Transaktions- oder Token-Transfer-CSV herunter. Die Akademie ordnet Datum, Hash, Richtung, Token und Betrag automatisch dieser Wallet und Chain zu.</span><input id="walletCsvFile" type="file" accept=".csv,text/csv"><button class="btn primary" id="walletCsvImport">CSV prüfen und übernehmen</button><div id="walletCsvResult" class="pipeline-log">Noch keine Explorer-CSV eingelesen.</div></div><iframe id="explorerFrame" class="explorer-frame" title="Blockchain-Explorer"></iframe>'''
          if old not in s: raise SystemExit('Explorer-Anker fehlt')
          s=s.replace(old,new,1)

          s=s.replace("<span class=\"status ${w.lookup?.ok?'ok':'bad'}\">${w.lookup?.ok?'Blockchain gelesen':'Prüfung offen'}</span>","<div class=\"status-stack\"><span class=\"status ${w.lookup?.ok?'ok':'bad'}\">${w.lookup?.ok?'Netzwerk erkannt':'Prüfung offen'}</span><span class=\"status ${w.lookup?.historyCount>0?'ok':w.lookup?.historyError?'bad':'warn'}\">${w.lookup?.historyCount>0?'Historie übernommen':w.lookup?.historyError?'Historie nicht erreichbar':'Historie noch offen'}</span></div>")
          s=s.replace("Transaktionen ${x.tx} · offene Punkte ${x.reviews}${w.lookup?.historyError?' · Historie nicht erreichbar':''}","Erkannt ${w.lookup?.txCount||0} · übernommen ${x.tx} · offene Punkte ${x.reviews}${w.lookup?.historyError?' · automatische Historie fehlgeschlagen':''}")
          s=s.replace("notify(`${hits.length} Netzwerk(e) übernommen · ${total} Blockchain-Einträge gelesen · ${imported} neu in Ihre Transaktionen eingefügt.`);go('ledger');return","notify(`${hits.length} Netzwerk(e) übernommen · ${total} Blockchain-Einträge gelesen · ${imported} neu in Ihre Transaktionen eingefügt.`);if(total>0||imported>0)go('ledger');else{go('sources');notify('Netzwerk erkannt, aber keine Historie geladen. Bitte Explorer & CSV verwenden.')}return")
          s=s.replace("$('explorerSync').onclick=async()=>{if(!explorerWallet)return;await lookup(explorerWallet);openExplorerWorkspace(explorerWallet);go('ledger')};","$('explorerSync').onclick=async()=>{if(!explorerWallet)return;await lookup(explorerWallet);openExplorerWorkspace(explorerWallet);const n=data.transactions.filter(t=>t.walletId===explorerWallet.id).length;if(n)go('ledger');else notify('Keine Historie übernommen. Bitte Explorer-CSV herunterladen und hier einlesen.')};")

          js=r'''
          /* WALLET_DATA_PIPELINE_V4 */
          const CHAIN_IDS={ethereum:1,bsc:56,polygon:137,arbitrum:42161,optimism:10,base:8453,avalanche:43114,fantom:250,gnosis:100,linea:59144,zksync:324,cronos:25};
          function setLookupStage(w,stage,extra={}){w.lookup={...(w.lookup||{}),stage,...extra}}
          function normaliseProviderTx(item,chain,wallet,kind='native'){const hash=item.hash||item.txHash||item.transactionHash||item.transaction_hash||'',from=lowerAddress(item.from?.hash||item.fromAddress||item.from),to=lowerAddress(item.to?.hash||item.toAddress||item.to),mine=lowerAddress(wallet.address),out=from===mine,incoming=to===mine,token=item.token||{},asset=kind==='token'?(token.symbol||item.tokenSymbol||item.symbol||'TOKEN'):chain.symbol,decimals=Number((item.total&&item.total.decimals)??token.decimals??item.tokenDecimal??18),raw=(item.total&&item.total.value)??item.value??item.amount??'0',date=item.timestamp||item.timeStamp||item.blockTimestamp||item.date||'',idx=item.log_index??item.logIndex??item.index??'';return{id:uid(),date:/^\d{10}$/.test(String(date))?new Date(Number(date)*1000).toISOString():String(date),type:out?'Auszahlung':incoming?'Einzahlung':kind==='token'?'Token-Transfer':'Blockchain-Vorgang',asset,amount:decimalAmount(String(raw),decimals),eur:'',exchangeId:wallet.exchangeId||'',walletId:wallet.id,source:'Blockchain',notes:`${chain.name} · ${kind==='token'?'Token-Transfer':item.method||item.functionName||'Transaktion'} · ${hash}`,auto:true,chain:chain.id,txHash:hash,direction:out?'ausgehend':incoming?'eingehend':'unbekannt',blockchainKey:`${chain.id}:${hash}:${kind}:${idx||asset}`}}
          async function providerBlockscoutV2(chain,wallet){if(!chain.explorer)throw Error('Kein Blockscout-Endpunkt');const base=chain.explorer.replace(/\/$/,''),a=encodeURIComponent(wallet.address);async function pages(path){let url=base+path,out=[];for(let i=0;i<10&&url;i++){const j=await explorerJson(url,20000);out.push(...(Array.isArray(j?.items)?j.items:[]));const np=j?.next_page_params;if(!np)break;url=base+path.split('?')[0]+'?'+new URLSearchParams(np).toString()}return out}const [n,t]=await Promise.allSettled([pages(`/api/v2/addresses/${a}/transactions`),pages(`/api/v2/addresses/${a}/token-transfers`)]),normal=n.status==='fulfilled'?n.value:[],tokens=t.status==='fulfilled'?t.value:[];if(!normal.length&&!tokens.length&&n.status==='rejected'&&t.status==='rejected')throw Error('nicht erreichbar');return{source:'Blockscout V2',normal,tokens}}
          async function providerBlockscoutLegacy(chain,wallet){if(!chain.explorer)throw Error('Kein Legacy-Endpunkt');const base=chain.explorer.replace(/\/$/,''),a=encodeURIComponent(wallet.address),[n,t]=await Promise.allSettled([explorerJson(`${base}/api?module=account&action=txlist&address=${a}&page=1&offset=10000&sort=asc`,25000),explorerJson(`${base}/api?module=account&action=tokentx&address=${a}&page=1&offset=10000&sort=asc`,25000)]),normal=n.status==='fulfilled'&&Array.isArray(n.value?.result)?n.value.result:[],tokens=t.status==='fulfilled'&&Array.isArray(t.value?.result)?t.value.result:[];if(!normal.length&&!tokens.length&&n.status==='rejected'&&t.status==='rejected')throw Error('nicht erreichbar');return{source:'Blockscout Legacy',normal,tokens}}
          async function providerRoutescan(chain,wallet){const cid=CHAIN_IDS[chain.id];if(!cid)throw Error('Chain-ID fehlt');const a=encodeURIComponent(wallet.address),base=`https://api.routescan.io/v2/network/mainnet/evm/${cid}/transactions`,[o,i]=await Promise.allSettled([explorerJson(`${base}?fromAddresses=${a}&sort=asc`,25000),explorerJson(`${base}?toAddresses=${a}&sort=asc`,25000)]),items=[];for(const r of[o,i])if(r.status==='fulfilled'&&Array.isArray(r.value?.items))items.push(...r.value.items);if(!items.length&&o.status==='rejected'&&i.status==='rejected')throw Error('nicht erreichbar');return{source:'Routescan',normal:[...new Map(items.map(x=>[x.hash||x.txHash||x.transactionHash||JSON.stringify(x),x])).values()],tokens:[]}}
          async function importEvmHistoryV4(chain,wallet){const attempts=[],providers=[providerBlockscoutV2,providerBlockscoutLegacy,providerRoutescan];let result=null;setLookupStage(wallet,'history-loading',{historyError:'',providerAttempts:[]});for(const provider of providers){try{const r=await provider(chain,wallet);attempts.push(`${r.source}: erreichbar (${r.normal.length+r.tokens.length})`);if(r.normal.length||r.tokens.length){result=r;break}}catch(e){attempts.push(`${provider.name}: ${e.message||e}`)}}if(!result){setLookupStage(wallet,'network-only',{historyError:'Automatische Historie über alle Datenquellen nicht erreichbar.',providerAttempts:attempts});return{added:0,total:0,error:wallet.lookup.historyError,attempts}}let added=0,dupes=0;for(const x of result.normal){const tx=normaliseProviderTx(x,chain,wallet,'native');if(tx.txHash){if(upsertBlockchainTx(tx))added++;else dupes++}}for(const x of result.tokens){const tx=normaliseProviderTx(x,chain,wallet,'token');if(tx.txHash){if(upsertBlockchainTx(tx))added++;else dupes++}}const total=result.normal.length+result.tokens.length;setLookupStage(wallet,'history-imported',{historyAt:new Date().toISOString(),historyCount:total,importedCount:data.transactions.filter(t=>t.walletId===wallet.id).length,historyError:'',provider:result.source,providerAttempts:attempts});return{added,total,dupes,provider:result.source,attempts}}
          importEvmHistory=importEvmHistoryV4;
          function normHeader(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'')}
          function firstField(row,map,names){for(const n of names){const k=map[normHeader(n)];if(k!==undefined&&row[k]!==undefined&&String(row[k]).trim()!=='')return String(row[k]).trim()}return''}
          function parseExplorerCsv(text){const lines=text.split(/\r?\n/).filter(x=>x.trim()),first=lines[0]||'',ds=[',',';','\t','|'],d=ds.sort((a,b)=>first.split(b).length-first.split(a).length)[0],read=l=>{let a=[],c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){a.push(c);c=''}else c+=ch}a.push(c);return a},all=lines.slice(0,10001).map(read),headers=all[0]||[],map={};headers.forEach((h,i)=>map[normHeader(h)]=i);return{rows:all.slice(1),map,truncated:lines.length>10001}}
          function parseExplorerDate(v){if(!v)return'';if(/^\d{10,13}$/.test(v)){const n=Number(v.length===10?v+'000':v);return new Date(n).toISOString()}const d=new Date(v);return isNaN(d)?v:d.toISOString()}
          function importExplorerCsvForWallet(file,wallet){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(Error('Datei konnte nicht gelesen werden'));r.onload=()=>{try{const{rows,map,truncated}=parseExplorerCsv(String(r.result||''));let added=0,dupes=0,unclear=0;for(const row of rows){const hash=firstField(row,map,['Txhash','TxHash','Transaction Hash','Hash']);if(!hash){unclear++;continue}const from=lowerAddress(firstField(row,map,['From','Sender','From Address'])),to=lowerAddress(firstField(row,map,['To','Receiver','To Address'])),mine=lowerAddress(wallet.address),symbol=firstField(row,map,['TokenSymbol','Token Symbol','Symbol','Asset','Token'])||EVM_CHAINS.find(c=>c.id===wallet.chain)?.symbol||wallet.chain.toUpperCase(),amount=firstField(row,map,['TokenValue','Token Value','Value_OUT(BNB)','Value_IN(BNB)','Value_OUT(ETH)','Value_IN(ETH)','Value','Amount']),date=parseExplorerDate(firstField(row,map,['DateTime','Date Time (UTC)','Timestamp','UnixTimestamp','Unix Timestamp'])),out=from===mine,incoming=to===mine,index=firstField(row,map,['LogIndex','Log Index','Index']),key=`${wallet.chain}:${hash}:csv:${symbol}:${index}`;if(data.transactions.some(t=>t.blockchainKey===key)){dupes++;continue}data.transactions.push({id:uid(),date,type:out?'Auszahlung':incoming?'Einzahlung':'Blockchain-Vorgang',asset:symbol,amount,eur:'',exchangeId:wallet.exchangeId||'',walletId:wallet.id,source:'Blockchain-CSV',notes:`${wallet.chainName||wallet.chain} · Explorer-CSV · ${hash}`,auto:true,chain:wallet.chain,txHash:hash,direction:out?'ausgehend':incoming?'eingehend':'unbekannt',blockchainKey:key});added++}setLookupStage(wallet,'history-imported',{historyCount:data.transactions.filter(t=>t.walletId===wallet.id).length,importedCount:data.transactions.filter(t=>t.walletId===wallet.id).length,historyError:'',csvImportedAt:new Date().toISOString(),provider:'Explorer-CSV'});checks();save();resolve({added,dupes,unclear,total:rows.length,truncated})}catch(e){reject(e)}};r.readAsText(file)})}
          $('walletCsvImport').onclick=async()=>{if(!explorerWallet)return;const f=$('walletCsvFile').files?.[0];if(!f)return alert('Bitte zuerst eine CSV-Datei auswählen.');$('walletCsvResult').textContent='CSV wird geprüft …';try{const x=await importExplorerCsvForWallet(f,explorerWallet);$('walletCsvResult').textContent=`Gelesen ${x.total} · neu übernommen ${x.added} · Dubletten ${x.dupes} · ungeklärt ${x.unclear}${x.truncated?' · Datei auf 10.000 Zeilen begrenzt':''}`;openExplorerWorkspace(explorerWallet);if(x.added)go('ledger')}catch(e){$('walletCsvResult').textContent='CSV konnte nicht verarbeitet werden: '+(e.message||e)}};
          const _openExplorerWorkspaceV3=openExplorerWorkspace;openExplorerWorkspace=function(w){_openExplorerWorkspaceV3(w);const attempts=(w.lookup?.providerAttempts||[]).join('\n');if($('walletCsvResult')&&!$('walletCsvFile').files?.length)$('walletCsvResult').textContent=attempts||'Automatische Datenquellen wurden noch nicht geprüft.'};
          '''
          anchor='buildNav();wire();updateExchangeHelp();checks();render();wireSafety();if(!data.guided)setTimeout(startGuide,150);'
          if anchor not in s: raise SystemExit('Startanker fehlt')
          s=s.replace(anchor,js+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('pages/krypto-steuer-assistent-v2/sw.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8').replace("krypto-steuer-akademie-v1","krypto-steuer-akademie-v3").replace("krypto-steuer-akademie-v2","krypto-steuer-akademie-v3")
              t=t.replace("u.search='';const key=new Request(u.toString(),{method:'GET',headers:e.request.headers,mode:e.request.mode,credentials:e.request.credentials,redirect:e.request.redirect});","const key=e.request;")
              sw.write_text(t,encoding='utf-8')
          PY
      - name: JavaScript-Syntax prüfen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('pages/krypto-steuer-assistent-v2/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('Script fehlt')
          Path('/tmp/krypto-check.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/krypto-check.js
      - name: Änderungen committen
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/krypto-steuer-assistent-v2/index.html pages/krypto-steuer-assistent-v2/sw.js
          git commit -m "Stabilisiert professionelle Wallet-Datenpipeline"
          git pull --rebase origin main
          git push origin main