name: Cleanup TLN Affiliate Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-tln-affiliate-archive.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fertige TLN-Seite prüfen
        shell: bash
        run: |
          test "$(wc -c < pages/tln/projekt-einstieg.html | tr -d ' ')" = "54680"
          echo "a4c88c07ac96c0a23da91736f8f971b0b7e46b36e836b9681ede5b96c9d7c1e1  pages/tln/projekt-einstieg.html" | sha256sum -c -

      - name: Temporäre Build-Dateien entfernen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tln-build
          git rm .github/workflows/build-tln-affiliate-archive.yml
          git commit -m "Temporäre TLN Build-Dateien entfernen"
          git push
